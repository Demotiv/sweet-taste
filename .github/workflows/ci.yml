name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore SweetTaste.sln

      - name: Build
        run: dotnet build SweetTaste.sln --no-restore --nologo

      - name: Test
        run: dotnet test SweetTaste.sln --no-build --nologo
