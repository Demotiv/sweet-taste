name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}' -replace '^v', ''

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Неверный тег версии: ${{ github.ref_name }}. Ожидается v0.1.0-alpha.3."
          }

          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Build release
        shell: pwsh
        run: pwsh -File scripts/release.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $zip = "dist/SweetTaste-$version-win-x64.zip"
          $hash = "$zip.sha256"
          $notes = "docs/releases/$version.md"

          if (-not (Test-Path -LiteralPath $zip)) {
              throw "Не найден архив $zip."
          }

          # Постоянные имена для ссылки «Скачать» на главной странице репозитория.
          $stableZip = "dist/SweetTaste-win-x64.zip"
          $stableHash = "$stableZip.sha256"
          Copy-Item -LiteralPath $zip -Destination $stableZip -Force
          $hashValue = ((Get-Content -LiteralPath $hash -Raw).Trim() -split '\s+')[0]
          [System.IO.File]::WriteAllText(
              $stableHash,
              "$hashValue  SweetTaste-win-x64.zip`r`n",
              (New-Object System.Text.UTF8Encoding($false)))

          gh release view $tag --json tagName 2>$null | Out-Null

          if ($LASTEXITCODE -eq 0) {
              gh release upload $tag $zip $hash $stableZip $stableHash --clobber
          } else {
              $arguments = @(
                  'release', 'create', $tag,
                  $zip,
                  $hash,
                  $stableZip,
                  $stableHash,
                  '--verify-tag',
                  '--title', "Sweet Taste $version"
              )

              if ($version -match '-') {
                  $arguments += '--prerelease'
              } else {
                  $arguments += '--latest'
              }

              if (Test-Path -LiteralPath $notes) {
                  $arguments += @('--notes-file', $notes)
              } else {
                  $arguments += '--generate-notes'
              }

              gh @arguments
          }
